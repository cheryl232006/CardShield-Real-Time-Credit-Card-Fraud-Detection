<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CARDShield — Real-Time Credit Card Fraud Detection & Risk Assessment System for DBMS Project">
  <title>CARDShield — Real-Time Credit Card Fraud Detection & Risk Assessment</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/customer.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="app-container">
    <!-- Application Navigation Header -->
    <header class="app-header">
      <div class="header-container">
        <!-- Brand Logo -->
        <a href="#" id="brand-link" class="brand-logo">
          <div class="brand-shield-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <span>CARDShield</span>
        </a>

        <!-- Portal Navigation Switcher -->
        <nav class="portal-nav">
          <button id="nav-customer-btn" class="portal-btn active">Customer Portal</button>
          <button id="nav-admin-btn" class="portal-btn">Admin Portal</button>
        </nav>

        <!-- Header Controls (Theme Toggle & Logout) -->
        <div class="header-actions" id="header-actions">
          <button id="logout-btn" class="btn btn-secondary text-xs hidden" style="padding: 6px 12px;" title="Logout Session">
            <span>Logout</span>
          </button>
          <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light / Dark Mode">
            <span id="theme-icon">🌙</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main View Dynamic Container -->
    <main class="main-content" id="app-content">
      <!-- Dynamic Views injected by JS app router -->
    </main>

    <!-- Footer -->
    <footer style="text-align: center; padding: 1.5rem; border-top: 1px solid var(--border-subtle); font-size: 0.8rem; color: var(--text-tertiary);">
      CARDShield : Real-Time Credit Card Fraud Detection and Risk Assessment System 
    </footer>
  </div>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
